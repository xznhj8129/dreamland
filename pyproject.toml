[project]
name = "dreamland"
version = "0.0.0"
description = "Unmanned Aerospace Sandbox: design, simulate and print small unmanned aircraft and rockets"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11,<3.13"
dependencies = [
    # exact: the aero results and the JSBSim model fingerprint (libs/jsbsim.py export_fingerprint) depend on them
    "aerosandbox==4.2.8",
    "neuralfoil==0.3.2",
    "aiohttp>=3.10.11",
    "cadquery>=2.7.0",
    "jsbsim>=1.3.1",
    "matplotlib>=3.10.5",
    "numpy>=2.2.6",
    "scipy>=1.16.1",
    "threadpoolctl>=3.6.0",
    "inavbench",
]

[dependency-groups]
dev = [
    "pymavlink>=2.4.49",  # webapp/test_sim_scenarios.py
    "ruff>=0.6",
]

[tool.uv]
package = false  # an application run from the checkout, not an installed package

[tool.uv.sources]
inavbench = { path = "vendor/inav-jsbsim-bench", editable = true }  # scripts/setup_vendor.sh (temporary)

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff's classic defaults, pinned so newer ruff releases do not widen the set
